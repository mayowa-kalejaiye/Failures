<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Lab: Retry — Failures</title><link rel="stylesheet" href="../../css/styles.css"><script src="https://cdn.tailwindcss.com"></script></head><body class="ba-prose" style="padding:40px;max-width:800px;margin:0 auto">
<h1>Lab: Retry — Backoff + Jitter</h1>
<p class="ba-lead">Turn a retry storm into scattered retries.</p>
<div class="my-4 border border-dashed border-foreground/[0.08] bg-foreground/[0.01] p-4">
  <div class="text-[11px] font-mono text-foreground/50 mb-2">TRY IT</div>
  <button onclick="document.getElementById('out').textContent='→ 100 clients retry at 1s → thundering herd → downstream dies'" class="px-3 py-1.5 bg-foreground text-background text-xs font-mono">No jitter</button>
  <button onclick="document.getElementById('out').textContent='→ same 100 with jitter 0-200ms → retries scatter → downstream survives'" class="ml-2 px-3 py-1.5 border border-foreground/15 bg-background text-xs font-mono">With jitter</button>
  <div id="out" class="mt-3 p-3 bg-background border border-foreground/[0.08] font-mono text-xs min-h-[48px]">Click a button</div>
</div>
<pre class="p-3 bg-foreground/[0.02] border border-foreground/[0.08] font-mono text-xs overflow-x-auto"><code>delay = Math.min(8000, 500 * (2 ** (attempt-1))) + Math.random()*200;
await sleep(delay); // jitter scatters herd</code></pre>
<p><a href="./">← Labs</a></p>
</body></html>

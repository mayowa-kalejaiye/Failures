[project]
name = "failures-mcp"
version = "0.3.1"
description = "Failures — deterministic MCP for AI-built software. 12 tools that make coding agents handle failure modes via AST checks."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mayowa Kalejaiye"}]
keywords = ["mcp", "model-context-protocol", "ai-agents", "resilience", "distributed-systems"]
dependencies = ["mcp>=2.0", "pydantic>=2", "anyio", "starlette", "httpx"]

[project.urls]
Homepage = "https://github.com/mayowa-kalejaiye/Failures"
Repository = "https://github.com/mayowa-kalejaiye/Failures"
Issues = "https://github.com/mayowa-kalejaiye/Failures/issues"

[project.scripts]
failures-mcp = "mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server", "mcp"]

[tool.hatch.build.targets.sdist]
include = ["mcp_server/", "mcp/", "principles/", "patterns/", "failures/", "FAILURES_SPEC.md", "README.md"]

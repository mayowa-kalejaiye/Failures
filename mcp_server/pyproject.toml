[project]
name = "failures-mcp"
version = "0.3.1"
description = "Failures MCP — deterministic MCP for AI-built software (12 tools, no LLM wrapper)"
readme = "../README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["mcp>=2.0", "pydantic>=2", "anyio", "starlette", "httpx", "sse-starlette"]

[project.scripts]
failures-mcp = "server:main"
failures = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
